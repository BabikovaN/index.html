<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR-картки «Чайові для баристи»</title>
<meta name="description" content="Картки з QR-кодом для чайових баристі — друк на А4, 4 картки на аркуш.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --espresso: #2E211B; --mocha: #6B5244; --latte: #C9B4A0; --foam: #F4EFE8; --stone: #8C837B; --line: #E4DCD2; --serif: 'Fraunces', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: #E9E4DD; color: var(--espresso); }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; max-width: 900px; margin: 0 auto; padding: 22px 18px; }
  .bar h1 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0; }
  .bar p { margin: 4px 0 0; color: var(--stone); font-size: 14px; }
  .btn { border: 0; background: var(--espresso); color: var(--foam); padding: 13px 20px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--espresso); border: 1px solid var(--mocha); }
  .sheet { width: 210mm; height: 297mm; margin: 0 auto 40px; background: #fff; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; box-shadow: 0 12px 40px rgba(0, 0, 0, .12); }
  .card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12mm 10mm; background: var(--foam); border: .2mm dashed #CFC5B9; overflow: hidden; }
  .card::before { content: ''; position: absolute; inset: 6mm; border: .4mm solid var(--latte); border-radius: 4mm; pointer-events: none; }
  .kick { font-size: 2.6mm; letter-spacing: .32em; text-transform: uppercase; color: var(--mocha); font-weight: 600; }
  .card h2 { font-family: var(--serif); font-weight: 400; font-size: 9.5mm; line-height: 1.05; margin: 3mm 0 2mm; }
  .card h2 em { color: var(--mocha); }
  .card p { font-size: 3.3mm; color: #5A4B42; margin: 0 0 5mm; line-height: 1.4; max-width: 70mm; }
  .qr { background: #fff; padding: 3mm; border-radius: 3mm; box-shadow: 0 1mm 3mm rgba(46, 33, 27, .12); }
  .qr img, .qr canvas { display: block; width: 38mm !important; height: 38mm !important; }
  .scan { margin-top: 4mm; font-size: 3mm; font-weight: 600; color: var(--espresso); display: flex; align-items: center; gap: 2mm; }
  .scan svg { width: 4.5mm; height: 4.5mm; }
  .name { margin-top: 2.5mm; font-family: var(--serif); font-style: italic; font-size: 4mm; color: var(--mocha); }
  .cup { position: absolute; right: 9mm; bottom: 9mm; width: 9mm; opacity: .5; }
  @media screen and (max-width: 820px) { .sheet { transform-origin: top left; transform: scale(calc((100vw - 20px) / 794px)); margin: 0 10px; height: calc(297mm * ((100vw - 20px) / 794px)); width: 210mm; } }
  @page { size: A4; margin: 0; }
  @media print { body { background: #fff; } .bar { display: none; } .sheet { margin: 0; box-shadow: none; transform: none !important; height: 297mm !important; } }
</style>
</head>
<body>
<div class="bar"><div><h1>QR-картки для чайових</h1><p>Друк на А4 · 4 картки на аркуш · розріжте по пунктиру. QR веде на сторінку чайових.</p></div>
  <div style="display:flex;gap:8px"><a class="btn ghost" href="https://babikovan.github.io/BabikovaNBabikova/" target="_blank" rel="noopener">Відкрити сторінку</a><button class="btn" onclick="print()">Друкувати</button></div></div>
<div class="sheet" id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const URL_TIPS = 'https://babikovan.github.io/BabikovaNBabikova/';
  const variants = [
    ['Coffee · Tips', 'Сподобалась <em>кава</em>?', 'Залиште чайові баристі — швидко й безпечно через monobank.'],
    ['Coffee · Tips', 'Дякую, що <em>завітали</em>', 'Якщо напій вийшов саме таким, як ви любите, — можна залишити чайові.'],
    ['Coffee · Tips', 'Чайові для <em>баристи</em>', 'Скануйте код камерою телефона — оплата карткою, Apple Pay чи Google Pay.'],
    ['Coffee · Tips', 'Гарного <em>дня</em>!', 'Маленька подяка — велика радість. Дякую за вашу усмішку ☕'],
  ];
  const cup = '<svg class="cup" viewBox="0 0 64 64"><path d="M14 24h30v12a15 15 0 0 1-30 0z" fill="#C9B4A0"/><path d="M44 27h3a5 5 0 0 1 0 10h-3" fill="none" stroke="#C9B4A0" stroke-width="3"/></svg>';
  const scan = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>';
  const sheet = document.getElementById('sheet');
  variants.forEach(([k, h, p], i) => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="kick">${k}</div><h2>${h}</h2><p>${p}</p><div class="qr" id="qr${i}"></div><div class="scan">${scan} Наведіть камеру</div><div class="name">бариста Саша</div>${cup}`;
    sheet.appendChild(c);
    new QRCode(document.getElementById('qr' + i), { text: URL_TIPS, width: 512, height: 512, colorDark: '#2E211B', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M });
  });
</script>
</body>
</html>
